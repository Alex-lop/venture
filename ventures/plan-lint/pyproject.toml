[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-plan-lint"
version = "0.1.0"
description = "Statically validate an agent's plan against a project policy before anything runs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Lopez" }]
keywords = [
    "agents",
    "ai-agents",
    "guardrails",
    "planning",
    "policy",
    "static-analysis",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
agent-plan-lint = "agent_plan_lint.cli:main"

[project.urls]
Homepage = "https://github.com/Alex-lop/agent-plan-lint"
Source = "https://github.com/Alex-lop/agent-plan-lint"
Changelog = "https://github.com/Alex-lop/agent-plan-lint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Alex-lop/agent-plan-lint/issues"

[tool.hatch.build.targets.sdist]
# An allowlist, so the tarball is a decision rather than whatever the working
# tree happens to contain (a stray venv breaks the build otherwise). The
# leading slash anchors each pattern at the project root, gitignore-style.
include = [
    "/.github",
    "/.gitignore",
    "/.python-version",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/demo",
    "/docs",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[dependency-groups]
dev = ["PyYAML>=6", "pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
